<style>
:root{
  --bg:#eef1ec; --ink:#12202b; --ink-soft:#46585d; --ink-faint:#7c8b88;
  --navy:#1c3548; --teal:#1f6f63; --brass:#8a6420; --line:#ccd6cd;
  --font-display:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --font-body:Seravek,"Gill Sans Nova","Ysabeau SC",Corbel,"Trebuchet MS",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d161d; --ink:#e7ede9; --ink-soft:#a8b7b4; --ink-faint:#71827f;
    --navy:#cfe0ea; --teal:#5cc0aa; --brass:#d7ad5c; --line:#28383e;
  }
}
:root[data-theme="dark"]{
  --bg:#0d161d; --ink:#e7ede9; --ink-soft:#a8b7b4; --ink-faint:#71827f;
  --navy:#cfe0ea; --teal:#5cc0aa; --brass:#d7ad5c; --line:#28383e;
}
*{box-sizing:border-box;}
body{
  margin:0; min-height:100vh; background:var(--bg); color:var(--ink); font-family:var(--font-body);
  display:flex; align-items:center; justify-content:center; text-align:center; padding:24px;
}
.card{max-width:440px;}
svg.mark{width:52px; height:40px; color:var(--brass); margin-bottom:22px;}
h1{font-family:var(--font-display); font-size:clamp(26px,4vw,32px); color:var(--navy); margin:0 0 12px; text-wrap:balance;}
p{color:var(--ink-soft); font-size:15.5px; line-height:1.6; margin:0 0 26px;}
.links{display:flex; gap:14px; justify-content:center; flex-wrap:wrap;}
a.btn{
  display:inline-flex; align-items:center; gap:6px; padding:10px 18px; border-radius:8px; font-size:14px;
  font-weight:600; text-decoration:none; border:1px solid var(--line); color:var(--ink);
}
a.btn.primary{background:var(--navy); color:var(--bg); border-color:var(--navy);}
a.btn:hover{border-color:var(--teal); color:var(--teal);}
a.btn.primary:hover{opacity:0.9; color:var(--bg);}
</style>
</head>
